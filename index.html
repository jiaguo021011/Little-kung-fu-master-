<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Kung Fu Master</title><style>*{box-sizing:border-box}body{margin:0;background:#fff3db;font-family:system-ui,Arial;color:#57352d}.wrap{max-width:650px;margin:auto;padding:12px}h1{font-size:clamp(25px,6vw,36px);color:#a1372f;margin:4px 0}small{letter-spacing:3px;color:#a26742}.scene{position:relative;height:340px;overflow:hidden;border:5px solid #ae493a;border-radius:26px;background:linear-gradient(#8ad6df,#dcf5da 72%,#d8b587 72%)}.sun{position:absolute;right:12%;top:45px;width:100px;height:100px;border-radius:50%;background:#ffea9e}.mount{position:absolute;bottom:26%;width:110%;height:45%;background:#9ac9ad;clip-path:polygon(0 100%,20% 5%,35% 70%,55% 0,75% 85%,90% 15%,100% 100%)}.lantern{position:absolute;top:12px;font-size:48px}.lantern.left{left:5%}.lantern.right{right:5%}.speech{position:absolute;z-index:5;top:12px;left:23%;width:54%;background:#fffaf0;border:4px solid #b76c44;border-radius:22px;text-align:center;padding:9px 4px;font-weight:800;font-size:16px}.floor{position:absolute;bottom:0;width:100%;height:22%;background:repeating-linear-gradient(90deg,#d9b789 0 72px,#cba574 74px 78px);border-top:12px solid #a16a44}.panda{position:absolute;z-index:3;bottom:12%;left:50%;width:165px;height:190px;transform:translateX(-50%);transition:transform .3s}.panda .head{position:absolute;z-index:4;top:0;left:27px;width:110px;height:98px;background:#fff;border:3px solid #47423e;border-radius:48%;box-shadow:inset -8px -7px #e6e6e6}.ear{position:absolute;top:-12px;width:35px;height:35px;background:#373437;border-radius:50%;z-index:-1}.ear.a{left:5px}.ear.b{right:5px}.eye{position:absolute;top:36px;width:31px;height:37px;background:#333;border-radius:50%;transform:rotate(15deg)}.eye.a{left:18px}.eye.b{right:18px;transform:rotate(-15deg)}.eye:after{content:'';position:absolute;top:10px;left:13px;width:9px;height:13px;border-radius:50%;background:white}.nose{position:absolute;top:69px;left:48px;width:15px;height:11px;background:#333;border-radius:50%}.body{position:absolute;top:85px;left:36px;width:94px;height:83px;background:#f9f9f9;border:3px solid #454044;border-radius:50%;z-index:2}.belt{position:absolute;top:130px;left:36px;width:94px;height:14px;background:#bd4135;z-index:3}.arm,.leg{position:absolute;background:#333;border:3px solid #242424;border-radius:30px;transform-origin:top center;transition:transform .22s,top .22s,left .22s}.arm{top:94px;width:30px;height:76px;z-index:3}.arm.a{left:22px;transform:rotate(22deg)}.arm.b{right:22px;transform:rotate(-22deg)}.leg{top:147px;width:32px;height:58px;z-index:1}.leg.a{left:47px;transform:rotate(15deg)}.leg.b{right:47px;transform:rotate(-15deg)}.panda.horse{transform:translateX(-50%) translateY(17px) scaleY(.88)}.panda.horse .leg.a{transform:rotate(48deg)}.panda.horse .leg.b{transform:rotate(-48deg)}.panda.punch .arm.b{transform:rotate(-105deg) translateY(-6px)}.panda.punch{transform:translateX(-50%) rotate(-5deg)}.panda.kick .leg.b{transform:rotate(-95deg)}.panda.kick{transform:translateX(-50%) translateY(-8px) rotate(-8deg)}.panda.block .arm.a{transform:rotate(-125deg)}.panda.block .arm.b{transform:rotate(125deg)}.panda.block{transform:translateX(-50%) translateY(-7px)}.panda.act{animation:bounce .35s 2}@keyframes bounce{50%{filter:drop-shadow(0 0 12px #fff3a0)}}.master{position:absolute;right:12px;bottom:22%;font-size:52px;z-index:4}.master span{display:block;background:#fff8e9;border:2px solid #b76c44;border-radius:18px;padding:3px 9px;font-size:14px;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.stat{background:#fffaf0;border:2px solid #e8c38d;border-radius:16px;text-align:center;padding:10px 3px}.stat b{display:block;font-size:22px}.stat small{letter-spacing:0;font-size:11px;font-weight:700}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.controls button{background:#fff0d9;border:3px solid #ad5545;border-radius:18px;min-height:94px;color:#65372d;font-size:15px;font-weight:800;box-shadow:0 5px #943e36;touch-action:manipulation}.controls button span{display:block;font-size:31px}.controls button:active{transform:translateY(4px);box-shadow:none}#status{text-align:center;font-size:19px;font-weight:800;color:#a13c31;min-height:52px;margin:20px 0 6px}.restart{display:block;margin:12px auto;background:#ffebc9;border:3px solid #c28d56;border-radius:16px;padding:10px 24px;font-size:19px;font-weight:bold;color:#76432f}.instructions{text-align:center;font-size:13px;color:#8b6455}.progress{height:10px;border-radius:9px;background:#e8c995;overflow:hidden;margin:16px 0}.progress div{height:100%;background:#b94d3f;width:0%;transition:width .3s}@media(max-width:430px){.scene{height:315px}.panda{bottom:12%}.controls button{font-size:12px;min-height:85px}.speech{font-size:14px}}</style></head><body><main class="wrap"><small>CHINESE CULTURE · MINI GAME</small><h1>🐼 Little Kung Fu Master</h1><section class="scene"><div class="sun"></div><div class="mount"></div><div class="lantern left">🏮</div><div class="lantern right">🏮</div><div class="speech" id="speech">Master says: Horse Stance!</div><div class="floor"></div><div class="panda" id="panda"><div class="leg a"></div><div class="leg b"></div><div class="body"></div><div class="belt"></div><div class="arm a"></div><div class="arm b"></div><div class="head"><div class="ear a"></div><div class="ear b"></div><div class="eye a"></div><div class="eye b"></div><div class="nose"></div></div></div><div class="master">🐯<span>Master Hu</span></div></section><div class="stats"><div class="stat"><small>LEVEL</small><b id="level">1 / 3</b></div><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>MOVES</small><b id="moves">0 / 10</b></div><div class="stat"><small>MISTAKES</small><b id="mistakes">0 / 3</b></div></div><h2 style="text-align:center">Learn the Moves</h2><p style="text-align:center">Watch the panda perform each kung fu move!</p><div class="progress"><div id="progress"></div></div><div class="controls"><button onclick="choose('block')"><span>⬅️</span>Block</button><button onclick="choose('horse')"><span>⬇️</span>Horse Stance</button><button onclick="choose('punch')"><span>➡️</span>Punch</button><button onclick="choose('kick')"><span>⬆️</span>Kick</button></div><div id="status" aria-live="polite">Ready for Level 1!</div><button class="restart" onclick="restart()">↻ Restart Game</button><p class="instructions">Tap buttons or use arrow keys · No camera needed · Fun for everyone</p></main><script>const moves={block:['⬅️','Block'],horse:['⬇️','Horse Stance'],punch:['➡️','Punch'],kick:['⬆️','Kick']};let level=1,score=0,count=0,errors=0,target='horse',finished=false,locked=false,timer;const el=id=>document.getElementById(id);function prompt(){const keys=Object.keys(moves);target=keys[Math.floor(Math.random()*keys.length)];el('speech').textContent='Master says: '+moves[target][0]+' '+moves[target][1]+'!'}function update(){el('level').textContent=level+' / 3';el('score').textContent=score;el('moves').textContent=count+' / 10';el('mistakes').textContent=errors+' / 3';el('progress').style.width=count*10+'%'}function choose(action){if(finished||locked)return;locked=true;clearTimeout(timer);let panda=el('panda');panda.className='panda '+action+' act';if(action===target){score+=10*level;count++;el('status').textContent='🥋 Great '+moves[action][1]+'!';}else{errors++;el('status').textContent='Try again! Watch Master Hu.'}update();timer=setTimeout(()=>{panda.className='panda';if(errors>=3){finished=true;el('status').textContent='Game over! Try again, young master!';el('speech').textContent='Keep practicing!';}else if(count>=10){if(level===3){finished=true;el('status').textContent='🏆 You are a Kung Fu Master! Score: '+score;el('speech').textContent='Congratulations!';}else{level++;count=0;errors=0;el('status').textContent='🎉 Level '+level+' unlocked!';update();prompt();}}else if(action===target){prompt()}locked=false},850)}function restart(){clearTimeout(timer);level=1;score=0;count=0;errors=0;finished=false;locked=false;el('panda').className='panda';el('status').textContent='Ready for Level 1!';update();prompt()}document.addEventListener('keydown',e=>{const keys={ArrowLeft:'block',ArrowDown:'horse',ArrowRight:'punch',ArrowUp:'kick'};if(keys[e.key]){e.preventDefault();choose(keys[e.key])}});restart();</script></body></html>
